name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_ios:
        description: '同时构建 iOS IPA (ubuntu runner 上无法构建, 勾选后走 macOS)'
        type: boolean
        default: true

permissions:
  contents: write   # 打 tag 时创建 Release 上传产物

jobs:
  binaries:
    name: Go 二进制 (linux amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: scripts/build.sh go

      - name: Test
        run: go test ./... -timeout 300s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hitest-linux-binaries
          path: bin/hitest-linux-*

      - name: Release (仅 tag 触发)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/hitest-linux-*
          generate_release_notes: true

  ios:
    name: iOS IPA (未签名)
    runs-on: macos-latest
    if: github.event_name == 'push' || inputs.build_ios
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build IPA
        run: scripts/build.sh ios

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hitest-ios-unsigned
          path: dist/hitest-ios-unsigned.ipa

      - name: Release (仅 tag 触发)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hitest-ios-unsigned.ipa
          generate_release_notes: true
