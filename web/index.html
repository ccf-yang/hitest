<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>hitest 主机状态</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(15,23,42,.92); backdrop-filter:blur(6px); z-index:5; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { font-size:12px; color:var(--muted); margin-top:2px; }
  #dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:6px; }
  .wrap { padding:16px; display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); max-width:1400px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card h2 { font-size:13px; margin:0 0 10px; color:var(--muted); font-weight:600; letter-spacing:.3px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; }
  .metric .k { font-size:12px; color:var(--muted); }
  .metric .v { font-size:20px; font-weight:600; margin-top:2px; }
  .bar { height:8px; background:#0b1220; border-radius:5px; overflow:hidden; margin-top:8px; }
  .bar > i { display:block; height:100%; background:var(--accent); width:0; transition:width .3s; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:6px 4px; border-bottom:1px solid rgba(51,65,85,.5); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  th { color:var(--muted); font-weight:500; }
  td.num,th.num { text-align:right; }
  .kv { display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:4px 0; border-bottom:1px dashed rgba(51,65,85,.5); }
  .kv span:first-child { color:var(--muted); }
  .kv span:last-child { text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  canvas { width:100%; height:120px; display:block; }
  .muted { color:var(--muted); font-size:12px; }
  .err { color:var(--err); font-size:12px; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:18px; }
</style>
</head>
<body>
<header>
  <div>
    <h1><span id="dot"></span><span id="hostname">hitest</span></h1>
    <div class="sub" id="osline">加载中...</div>
  </div>
  <div class="sub" id="updated">—</div>
</header>

<div class="wrap">
  <section class="card" style="grid-column:1/-1">
    <h2>概览</h2>
    <div class="grid2" id="overview"></div>
  </section>

  <section class="card">
    <h2>CPU 使用率</h2>
    <div class="metric"><span class="v" id="cpu-val">-</span></div>
    <div class="bar"><i id="cpu-bar"></i></div>
    <div class="muted" id="load-line" style="margin-top:8px"></div>
  </section>

  <section class="card">
    <h2>内存 / Swap</h2>
    <div class="metric"><span class="v" id="mem-val">-</span></div>
    <div class="bar"><i id="mem-bar"></i></div>
    <div class="muted" id="swap-line" style="margin-top:8px"></div>
  </section>

  <section class="card" style="grid-column:1/-1">
    <h2>监控曲线（近 1 小时）</h2>
    <canvas id="chart"></canvas>
    <div class="muted" id="chart-legend" style="margin-top:6px"></div>
  </section>

  <section class="card">
    <h2>Top CPU 进程</h2>
    <table><thead><tr><th>进程</th><th class="num">CPU</th></tr></thead><tbody id="topcpu"></tbody></table>
  </section>

  <section class="card">
    <h2>Top 内存进程</h2>
    <table><thead><tr><th>进程</th><th class="num">内存</th></tr></thead><tbody id="topmem"></tbody></table>
  </section>

  <section class="card" style="grid-column:1/-1">
    <h2>磁盘</h2>
    <table><thead><tr><th>挂载点</th><th>设备</th><th class="num">总量</th><th class="num">已用</th><th class="num">使用率</th></tr></thead><tbody id="disks"></tbody></table>
  </section>

  <section class="card" style="grid-column:1/-1">
    <h2>系统信息</h2>
    <div id="sysinfo"></div>
  </section>
</div>

<footer>hitest · 主机状态面板</footer>

<script>
const $ = (id) => document.getElementById(id);
const api = (p) => fetch('/api/v2' + p, { headers: { 'Content-Type': 'application/json' } }).then(r => r.json());

function fmtBytes(n) {
  if (n === undefined || n === null || isNaN(n)) return '-';
  const u = ['B','KB','MB','GB','TB','PB']; let i = 0; n = Number(n);
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(n >= 100 || i === 0 ? 0 : 1) + ' ' + u[i];
}
function fmtUptime(rt) {
  if (!rt) return '-';
  return `${rt.days||0}天 ${rt.hours||0}小时 ${rt.minutes||0}分`;
}

let history = { cpu: [], mem: [], t: [] };

function metric(k, v, cls) { return `<div class="metric"><div class="k">${k}</div><div class="v ${cls||''}">${v}</div></div>`; }

async function refresh() {
  try {
    const osRes = await api('/dashboard/base/os');
    const os = osRes.data || {};
    $('hostname').textContent = os.prettyDistro || os.platform || 'hitest';
    $('osline').textContent = `${os.prettyDistro || os.platform || ''} · ${os.kernelArch || ''} · ${os.kernelVersion || ''}`;

    const baseRes = await api('/dashboard/base/all/all');
    const base = baseRes.data || {};
    const cur = base.currentInfo || {};

    $('overview').innerHTML = [
      metric('运行时长', fmtUptime(cur.runningTime)),
      metric('负载 (1/5/15)', `${(cur.load1||0).toFixed(2)} / ${(cur.load5||0).toFixed(2)} / ${(cur.load15||0).toFixed(2)}`),
      metric('CPU 核心', `${base.cpuCores||0} 核 / ${base.cpuLogicalCores||0} 线程`),
      metric('进程数', cur.procs ?? '-'),
      metric('内存', fmtBytes(cur.memoryUsed) + ' / ' + fmtBytes(cur.memoryTotal)),
      metric('网络', '↑' + fmtBytes(cur.netBytesSent) + '  ↓' + fmtBytes(cur.netBytesRecv)),
    ].join('');

    const cpu = cur.cpuUsedPercent || 0;
    $('cpu-val').textContent = cpu.toFixed(1) + '%';
    $('cpu-bar').style.width = Math.min(cpu, 100) + '%';
    $('cpu-bar').style.background = cpu > 90 ? 'var(--err)' : cpu > 70 ? 'var(--warn)' : 'var(--accent)';
    $('load-line').textContent = `负载 ${(cur.load1||0).toFixed(2)} / ${(cur.load5||0).toFixed(2)} / ${(cur.load15||0).toFixed(2)}`;

    const mem = cur.memoryUsedPercent || 0;
    $('mem-val').textContent = fmtBytes(cur.memoryUsed) + ' / ' + fmtBytes(cur.memoryTotal) + ' (' + mem.toFixed(1) + '%)';
    $('mem-bar').style.width = Math.min(mem, 100) + '%';
    $('mem-bar').style.background = mem > 90 ? 'var(--err)' : mem > 75 ? 'var(--warn)' : 'var(--ok)';
    $('swap-line').textContent = cur.swapMemoryTotal ? `Swap ${fmtBytes(cur.swapMemoryUsed)} / ${fmtBytes(cur.swapMemoryTotal)}` : 'Swap 未启用';

    $('topcpu').innerHTML = (cur.topCPUItems || []).slice(0, 8).map(p =>
      `<tr><td title="${p.cmd||''}">${p.name} <span class="muted">#${p.pid}</span></td><td class="num">${(p.percent||0).toFixed(1)}%</td></tr>`).join('') || '<tr><td colspan="2" class="muted">无数据</td></tr>';
    $('topmem').innerHTML = (cur.topMemItems || []).slice(0, 8).map(p =>
      `<tr><td title="${p.cmd||''}">${p.name} <span class="muted">#${p.pid}</span></td><td class="num">${fmtBytes(p.memory)}</td></tr>`).join('') || '<tr><td colspan="2" class="muted">无数据</td></tr>';

    $('disks').innerHTML = (cur.diskData || []).map(d =>
      `<tr><td>${d.path}</td><td class="muted">${d.device||'-'}</td><td class="num">${fmtBytes(d.total)}</td><td class="num">${fmtBytes(d.used)}</td><td class="num">${(d.usedPercent||0).toFixed(1)}%</td></tr>`).join('') || '<tr><td colspan="5" class="muted">无数据</td></tr>';

    $('sysinfo').innerHTML = [
      ['主机名', base.hostname], ['发行版', base.prettyDistro || base.platform],
      ['内核', base.kernelVersion + ' (' + base.kernelArch + ')'],
      ['CPU 型号', base.cpuModelName], ['CPU 频率', base.cpuMhz ? base.cpuMhz.toFixed(0) + ' MHz' : '-'],
      ['IP 地址', base.ipV4Addr], ['虚拟化', base.virtualizationSystem || '-'],
    ].map(([k, v]) => `<div class="kv"><span>${k}</span><span title="${v||''}">${v || '-'}</span></div>`).join('');

    $('updated').textContent = '更新于 ' + new Date().toLocaleTimeString();
    $('dot').style.background = 'var(--ok)';

    // 采样用于曲线
    const now = Date.now();
    history.t.push(now); history.cpu.push(cpu); history.mem.push(mem);
    if (history.t.length > 120) { history.t.shift(); history.cpu.shift(); history.mem.shift(); }
    drawChart();
  } catch (e) {
    $('dot').style.background = 'var(--err)';
    $('updated').innerHTML = '<span class="err">连接失败：' + e.message + '</span>';
  }
}

function drawChart() {
  const cv = $('chart'); const dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const w = cv.clientWidth, h = cv.clientHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) { const y = h * i / 4; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  if (history.cpu.length < 2) { ctx.fillStyle = '#64748b'; ctx.fillText('采集中...', 8, 18); return; }
  const line = (arr, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
    arr.forEach((v, i) => { const x = w * i / (arr.length - 1); const y = h - (Math.min(v, 100) / 100) * h; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
  };
  line(history.cpu, '#3b82f6');
  line(history.mem, '#22c55e');
  $('chart-legend').innerHTML = '<span style="color:#3b82f6">■ CPU</span>&nbsp;&nbsp;<span style="color:#22c55e">■ 内存</span>';
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
