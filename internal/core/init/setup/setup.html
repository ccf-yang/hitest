<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hitest 初始化</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); padding: 24px;
        }
        .card {
            width: 100%; max-width: 420px; background: #fff; border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,.25); padding: 32px;
        }
        h1 { margin: 0 0 4px; font-size: 22px; color: #1e293b; }
        p.sub { margin: 0 0 24px; font-size: 13px; color: #64748b; }
        label { display: block; font-size: 13px; color: #334155; margin: 14px 0 6px; }
        input {
            width: 100%; height: 40px; padding: 0 12px; font-size: 14px; color: #0f172a;
            border: 1px solid #cbd5e1; border-radius: 8px; outline: none; background: #fff;
        }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
        button {
            width: 100%; height: 44px; margin-top: 24px; border: 0; border-radius: 8px;
            background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        button:disabled { opacity: .6; cursor: not-allowed; }
        .msg { margin-top: 16px; font-size: 13px; min-height: 18px; }
        .msg.error { color: #dc2626; }
        .msg.ok { color: #16a34a; }
    </style>
</head>
<body>
    <div class="card">
        <h1>hitest 初始化</h1>
        <p class="sub">首次运行，请填写基础配置后启动面板。</p>
        <form id="form">
            <label for="baseDir">安装目录</label>
            <input id="baseDir" name="baseDir" value="/opt" autocomplete="off" />

            <label for="port">监听端口</label>
            <input id="port" name="port" value="9999" autocomplete="off" />

            <label for="username">管理员账号</label>
            <input id="username" name="username" value="admin" autocomplete="off" />

            <label for="password">管理员密码</label>
            <input id="password" name="password" type="password" autocomplete="new-password" />

            <button id="submit" type="submit">开始初始化</button>
            <div class="msg" id="msg"></div>
        </form>
    </div>
    <script>
        const form = document.getElementById('form');
        const msg = document.getElementById('msg');
        const btn = document.getElementById('submit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.className = 'msg';
            msg.textContent = '正在初始化...';
            btn.disabled = true;
            try {
                const payload = {
                    baseDir: document.getElementById('baseDir').value.trim(),
                    port: document.getElementById('port').value.trim(),
                    username: document.getElementById('username').value.trim(),
                    password: document.getElementById('password').value,
                };
                const res = await fetch('/api/v2/core/setup/init', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    throw new Error(data.error || '初始化失败');
                }
                msg.className = 'msg ok';
                msg.textContent = '初始化成功，正在启动面板，请稍候...';
                setTimeout(() => { window.location.href = '/'; }, 1500);
            } catch (err) {
                msg.className = 'msg error';
                msg.textContent = err.message || '初始化失败';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
